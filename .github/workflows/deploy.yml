name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Inject API key
        run: |
          node -e "
          const fs = require('fs');
          let config = fs.readFileSync('public/js/config.js', 'utf8');
          config = config.replace('DEEPSEEK_API_KEY_PLACEHOLDER', process.env.DS_KEY);
          fs.writeFileSync('public/js/config.js', config);
          "
        env:
          DS_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
