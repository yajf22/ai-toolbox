name: Auto Check Payments

on:
  schedule:
    - cron: '*/10 * * * *'   # 每10分钟检查支付
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - name: Install dependencies
        run: |
          npm init -y
          npm install axios
        
      - name: Check payments
        run: node auto-check-payments.js
      
      - name: Check DeepSeek balance (every 6 hours)
        run: |
          HOUR=$(date +%H)
          if [ $((10#$HOUR % 6)) -eq 0 ]; then
            node auto-check-balance.js
          fi
      
      - name: Commit results
        run: |
          git config user.name "System Bot"
          git config user.email "bot@ai-toolbox"
          git add data/ public/data/
          git diff --staged --quiet || git commit -m "Auto-update system records [skip ci]"
          git push
