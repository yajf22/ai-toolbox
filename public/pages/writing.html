<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI智能写作 - AI工具箱</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .tool-selector { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
        .tool-selector button { 
            padding: 8px 20px; border: 2px solid var(--border); border-radius: 50px;
            background: white; cursor: pointer; font-size: 0.9rem; transition: all 0.2s;
        }
        .tool-selector button.active { border-color: var(--primary); background: var(--primary); color: white; }
        .result-actions { display: flex; gap: 12px; margin-top: 16px; }
        .loader { text-align: center; padding: 40px; }
        .loader::after { 
            content: "⏳ AI 生成中..."; font-size: 1.2rem;
            animation: pulse 1s infinite;
        }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
        .warning { background: #fff3cd; border: 1px solid #ffc107; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-size: 0.9rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">✨ AI工具箱</a>
            <div class="nav-status" id="navStatus">🔓 免费模式</div>
        </div>
    </nav>

    <div class="tool-page">
        <div class="tool-header">
            <h1>✍️ AI智能写作</h1>
            <p>选择写作类型，输入主题，AI自动生成高质量内容</p>
        </div>

        <div class="warning">
            ⚡ 当前为 <strong>GitHub Pages</strong> 版本，AI调用直接从你的浏览器到 DeepSeek API。
            免费用户每天可用3次，VIP用户无限使用。<br>
            <strong>VIP购买：</strong>发送 <strong>1 USDT (TRC-20)</strong> 到 <code>TBHxP5cowCPmjcCrCcbjZg2oRRqpW6Dz6p</code>，联系作者激活。
        </div>

        <div class="usage-counter" id="usageDisplay">今日免费使用：<span id="freeCount">3</span>/3 次</div>

        <div class="tool-form">
            <label>选择写作类型</label>
            <div class="tool-selector" id="toolSelector"></div>

            <label for="inputText">输入主题或要求</label>
            <textarea id="inputText" rows="4" placeholder="请输入你想要的写作主题，例如：夏日护肤必备好物推荐"></textarea>

            <div id="extraFields" style="display:none">
                <label for="targetLang">目标语言</label>
                <select id="targetLang">
                    <option value="中文">中文</option>
                    <option value="英文">English</option>
                    <option value="日语">日本語</option>
                    <option value="韩语">한국어</option>
                    <option value="法语">Français</option>
                </select>
            </div>

            <button class="btn btn-primary" onclick="generate()" id="genBtn">🚀 生成内容</button>
        </div>

        <div id="loader" class="loader" style="display:none"></div>
        <div id="result" class="tool-result" style="display:none"></div>
    </div>

    <script src="/js/config.js"></script>
    <script>
        const PROMPTS = {
            xiaohongshu: (topic) => [
                { role: "system", content: "你是一个小红书爆款文案写作专家。写一篇吸引人的小红书风格笔记，包含：吸引眼球的标题、emoji表情、分段清晰的内容、相关标签。语言活泼亲切。" },
                { role: "user", content: `请写一篇关于"${topic}"的小红书笔记` }
            ],
            "product-desc": (product) => [
                { role: "system", content: "你是一个电商文案专家。写产品描述要突出卖点、解决用户痛点、包含使用场景。" },
                { role: "user", content: `请为"${product}"写一段电商产品描述` }
            ],
            article: (topic) => [
                { role: "system", content: "你是一个专业文章写手。写一篇结构清晰、内容充实的公众号风格文章。" },
                { role: "user", content: `请写一篇关于"${topic}"的公众号文章` }
            ],
            "short-video": (topic) => [
                { role: "system", content: "你是一个短视频脚本专家。写15-60秒的短视频脚本，包含开场hook、主要内容、结尾引导互动。" },
                { role: "user", content: `请写一个关于"${topic}"的短视频脚本` }
            ],
            seo: (keyword) => [
                { role: "system", content: "你是一个SEO内容专家。写一篇搜索引擎优化的文章，自然融入关键词，结构清晰。" },
                { role: "user", content: `请写一篇围绕关键词"${keyword}"的SEO优化文章` }
            ],
            translate: (text, lang) => [
                { role: "system", content: `你是一个专业翻译。将文本翻译成${lang}，保持原意和语气，自然流畅。` },
                { role: "user", content: text }
            ],
            custom: (prompt) => [
                { role: "system", content: "你是一个AI助手，请根据用户的要求完成创作。" },
                { role: "user", content: prompt }
            ]
        };

        const TOOLS = {
            'xiaohongshu': { name: '小红书文案', icon: '📕' },
            'product-desc': { name: '电商产品描述', icon: '🏷️' },
            'article': { name: '公众号文章', icon: '📰' },
            'short-video': { name: '短视频脚本', icon: '🎬' },
            'seo': { name: 'SEO优化文章', icon: '🔍' },
            'translate': { name: '翻译', icon: '🌐' },
            'custom': { name: '自由创作', icon: '✏️' }
        };
        let currentTool = 'xiaohongshu';

        document.addEventListener('DOMContentLoaded', () => {
            updateUI();
            const selector = document.getElementById('toolSelector');
            Object.entries(TOOLS).forEach(([key, val]) => {
                const btn = document.createElement('button');
                btn.textContent = val.icon + ' ' + val.name;
                btn.onclick = () => selectTool(key);
                if (key === currentTool) btn.className = 'active';
                selector.appendChild(btn);
            });
            updateFreeCount();
        });

        function selectTool(tool) {
            currentTool = tool;
            document.querySelectorAll('.tool-selector button').forEach(b => b.className = '');
            document.querySelectorAll('.tool-selector button')[Object.keys(TOOLS).indexOf(tool)].className = 'active';
            document.getElementById('extraFields').style.display = tool === 'translate' ? 'block' : 'none';
            updateFreeCount();
        }

        function updateUI() {
            const vip = localStorage.getItem('vip_expiry');
            const navStatus = document.getElementById('navStatus');
            if (vip && Date.now() < parseInt(vip)) {
                navStatus.innerHTML = '⭐ VIP';
                navStatus.style.background = '#6c5ce7';
                navStatus.style.color = 'white';
                window.isVIP = true;
            } else {
                navStatus.innerHTML = '🔓 免费模式';
                navStatus.style.background = '#f0f0f0';
                navStatus.style.color = '';
                window.isVIP = false;
            }
            updateFreeCount();
        }

        function updateFreeCount() {
            const el = document.getElementById('freeCount');
            if (window.isVIP) { el.textContent = '∞'; return; }
            const today = new Date().toDateString();
            const uses = parseInt(localStorage.getItem('free_use_writing_' + today) || '0');
            el.textContent = Math.max(0, 3 - uses);
        }

        async function generate() {
            const input = document.getElementById('inputText').value.trim();
            if (!input) { alert('请输入主题或内容'); return; }

            const today = new Date().toDateString();
            const uses = parseInt(localStorage.getItem('free_use_writing_' + today) || '0');
            if (!window.isVIP && uses >= 3) {
                alert('今日免费次数已用完（3/3）。VIP无限使用！\n\n购买VIP：\n发送 1 USDT (TRC-20)\n到地址: TBHxP5cowCPmjcCrCcbjZg2oRRqpW6Dz6p');
                return;
            }

            const btn = document.getElementById('genBtn');
            btn.disabled = true;
            btn.textContent = '⏳ 生成中...';
            document.getElementById('loader').style.display = 'block';
            document.getElementById('result').style.display = 'none';

            try {
                let messages;
                if (currentTool === 'translate') {
                    const lang = document.getElementById('targetLang').value;
                    messages = PROMPTS[currentTool](input, lang);
                } else {
                    messages = PROMPTS[currentTool](input);
                }

                const res = await fetch('https://api.deepseek.com/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + DEEPSEEK_CONFIG.apiKey
                    },
                    body: JSON.stringify({
                        model: DEEPSEEK_CONFIG.model,
                        messages: messages,
                        max_tokens: 4096,
                        temperature: 0.7
                    })
                });

                const data = await res.json();
                if (data.error) throw new Error(data.error.message);

                document.getElementById('result').style.display = 'block';
                document.getElementById('result').textContent = data.choices[0].message.content;

                if (!window.isVIP) {
                    localStorage.setItem('free_use_writing_' + today, (uses + 1).toString());
                    updateFreeCount();
                }

            } catch(e) {
                document.getElementById('result').style.display = 'block';
                document.getElementById('result').textContent = '❌ 生成失败：' + e.message;
            }

            btn.disabled = false;
            btn.textContent = '🚀 生成内容';
            document.getElementById('loader').style.display = 'none';
        }
    </script>
</body>
</html>
