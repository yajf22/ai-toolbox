<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel处理 - AI工具箱</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">✨ AI工具箱</a>
            <div class="nav-status" id="navStatus">🔓 免费模式</div>
        </div>
    </nav>

    <div class="tool-page">
        <div class="tool-header">
            <h1>📊 Excel处理</h1>
            <p>在线处理Excel文件，无需上传到服务器</p>
        </div>

        <div class="tools-grid" style="margin-top:40px">
            <div class="tool-card">
                <div class="tool-icon">🔗</div>
                <h3>合并工作表</h3>
                <p>合并多个Excel文件</p>
                <p style="color:var(--accent);font-size:0.85rem">即将上线</p>
            </div>
            <div class="tool-card">
                <div class="tool-icon">🧹</div>
                <h3>数据清洗</h3>
                <p>清除重复、格式化数据</p>
                <p style="color:var(--accent);font-size:0.85rem">即将上线</p>
            </div>
            <div class="tool-card">
                <div class="tool-icon">🔄</div>
                <h3>格式转换</h3>
                <p>Excel转CSV/JSON/PDF</p>
                <p style="color:var(--accent);font-size:0.85rem">即将上线</p>
            </div>
            <div class="tool-card">
                <div class="tool-icon">📋</div>
                <h3>批量处理</h3>
                <p>批量处理多个Excel文件</p>
                <p style="color:var(--accent);font-size:0.85rem">即将上线</p>
            </div>
        </div>

        <div style="text-align:center;margin-top:60px;padding:40px;background:#f8f9fe;border-radius:16px">
            <h3>🔧 开发中</h3>
            <p style="color:var(--text-light);margin-top:12px">
                Excel处理功能正在开发中，敬请期待！<br>
                同时可以使用 <a href="/pages/writing.html">AI智能写作</a> 功能
            </p>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script>document.addEventListener('DOMContentLoaded', updateUI);</script>
</body>
</html>
